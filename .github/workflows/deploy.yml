name: Deploy baseballgame to CORESERVER

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "本番へ反映する場合は true。false の場合は dry-run のみ。"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: baseballgame-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dry-run deploy by FTPS
        if: ${{ github.event.inputs.apply != 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CORESERVER_FTP_SERVER }}
          username: ${{ secrets.CORESERVER_FTP_USERNAME }}
          password: ${{ secrets.CORESERVER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.CORESERVER_FTP_SERVER_DIR }}
          dry-run: true
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            DEPLOY.md
            HANDOVER.md
            CLAUDE.md
            docs/**
            **/*.zip
            **/*.bak
            **/*.tmp
            desktop.ini
            requests/**
            scores/**
            vendor/**

      - name: Apply deploy by FTPS
        if: ${{ github.event.inputs.apply == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CORESERVER_FTP_SERVER }}
          username: ${{ secrets.CORESERVER_FTP_USERNAME }}
          password: ${{ secrets.CORESERVER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.CORESERVER_FTP_SERVER_DIR }}
          dry-run: false
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            DEPLOY.md
            HANDOVER.md
            CLAUDE.md
            docs/**
            **/*.zip
            **/*.bak
            **/*.tmp
            desktop.ini
            requests/**
            scores/**
            vendor/**

      - name: Post deploy note
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          echo "Deploy finished. Check https://www.realemotionfactory.com/baseball/ manually."
