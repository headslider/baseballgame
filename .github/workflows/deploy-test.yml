name: Deploy TEST

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: deploy-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/')
    runs-on: ubuntu-latest
    environment: baseball_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./scores/*" \
            -not -path "./requests/*" \
            -print0 | xargs -0 -n1 php -l

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          import pathlib

          skipped_parts = {".git", ".github", ".codex", "scores", "requests", "vendor"}
          for path in pathlib.Path(".").rglob("*.json"):
              if any(part in skipped_parts for part in path.parts):
                  continue
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)
          PY

      - name: Validate operational data is excluded from Git changes
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -E '^(scores|requests|vendor)/' | grep -v '^scores/release_versions\.json$' ; then
            echo "::error::scores/, requests/, or vendor/ changed in this PR. Operational data must not be deployed from repository. Only scores/release_versions.json is allowed for PWA version metadata."
            exit 1
          fi
          echo "OK: this PR does not change operational scores/, requests/, or vendor/ data."

      - name: Prepare deploy package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package
          rsync -a ./ deploy-package/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.codex/' \
            --exclude 'deploy-package/' \
            --exclude 'CLAUDE.md' \
            --exclude 'docs/' \
            --exclude 'scores/' \
            --exclude 'requests/' \
            --exclude 'vendor/'
          mkdir -p deploy-package/scores
          cp scores/release_versions.json deploy-package/scores/release_versions.json

      - name: Deploy to baseball_test
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CORESERVER_FTP_SERVER }}
          username: ${{ secrets.CORESERVER_FTP_USERNAME }}
          password: ${{ secrets.CORESERVER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy-package/
          server-dir: ${{ secrets.CORESERVER_FTP_TEST_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            CLAUDE.md
            docs/**
            **/scores/**
            **/requests/**
            **/vendor/**
