<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>アカウント削除｜少年野球シミュレーター「野球やろうぜ！」</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .delete-page {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    .delete-card {
      background: #f8f9fa;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }
    .delete-card h1 {
      font-size: 24px;
      color: #212529;
      margin: 0 0 16px 0;
    }
    .delete-card p {
      color: #6c757d;
      line-height: 1.6;
      margin: 12px 0;
    }
    .delete-warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 6px;
      padding: 12px;
      margin: 20px 0;
      color: #664d03;
    }
    .delete-form {
      margin: 24px 0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #212529;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
    }
    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }
    .delete-btn {
      background: #dc3545;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }
    .delete-btn:hover {
      background: #c82333;
    }
    .cancel-btn {
      background: #6c757d;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-decoration: none;
      text-align: center;
    }
    .cancel-btn:hover {
      background: #5a6268;
    }
    .delete-note {
      background: #e7f3ff;
      border-left: 4px solid #0d6efd;
      padding: 12px;
      margin: 20px 0;
      color: #004085;
    }
  </style>
</head>
<body class="home">
  <main class="delete-page">
    <div class="delete-card">
      <h1>アカウント削除</h1>

      <p>
        このページでは、プレイヤーアカウントの削除を申請できます。
      </p>

      <div class="delete-warning">
        <strong>⚠️ 重要な注意</strong><br>
        削除されたアカウントは復旧できません。削除前に必ずご確認ください。
      </div>

      <h3>削除対象データ</h3>
      <p>
        アカウント削除時に、以下のデータがすべて削除されます：
      </p>
      <ul>
        <li>プレイヤープロフィール情報</li>
        <li>ゲーム成績・スコア</li>
        <li>ランキング記録</li>
        <li>間違いプレイチェック履歴</li>
        <li>野球博士チャレンジの成績</li>
        <li>その他アカウントに紐づくすべてのデータ</li>
      </ul>

      <form class="delete-form" id="deleteForm">
        <div class="form-group">
          <label for="playerId">プレイヤーID</label>
          <input type="text" id="playerId" name="player_id" required placeholder="削除するプレイヤーIDを入力してください">
        </div>

        <div class="form-group">
          <label for="reason">削除理由（任意）</label>
          <textarea id="reason" name="reason" placeholder="削除理由があればご記入ください"></textarea>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="confirm" name="confirm" required>
            上記の通り、すべてのデータが削除されることを理解し、同意します
          </label>
        </div>

        <div class="delete-note">
          削除リクエストは管理チームで確認後、3営業日以内に実行されます。<br>
          ご質問やご不明な点は、お問い合わせフォームよりお気軽にご連絡ください。
        </div>

        <div class="form-actions">
          <button type="button" class="cancel-btn" onclick="window.history.back()">キャンセル</button>
          <button type="submit" class="delete-btn">削除申請</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('deleteForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const playerId = document.getElementById('playerId').value.trim();
      const reason = document.getElementById('reason').value.trim();
      const confirm = document.getElementById('confirm').checked;

      if (!playerId) {
        alert('プレイヤーIDを入力してください');
        return;
      }

      if (!confirm) {
        alert('確認チェックボックスにチェックしてください');
        return;
      }

      // 最終確認
      if (!window.confirm(
        '本当に削除してもよろしいですか？\n\n' +
        'プレイヤーID: ' + playerId + '\n\n' +
        'この操作は取り消せません。'
      )) {
        return;
      }

      // 削除要求送信
      const formData = new FormData();
      formData.append('player_id', playerId);
      formData.append('reason', reason);
      formData.append('confirm', '1');

      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = '送信中...';

      fetch('api/user_delete_request.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          alert(
            '削除申請を受け付けました。\n\n' +
            'リクエストID: ' + data.request_id + '\n\n' +
            data.next_step
          );
          document.getElementById('deleteForm').reset();
        } else {
          alert('削除申請に失敗しました: ' + data.error);
        }
      })
      .catch(err => {
        alert('削除申請に失敗しました: ' + err.message);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = '削除申請';
      });
    });
  </script>
</body>
</html>
